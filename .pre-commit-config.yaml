repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        language_version: python3
        exclude: ^tests/

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        exclude: ^tests/

  # Linting
  - repo: https://github.com/PyCQA/pylint
    rev: 2.17.4
    hooks:
      - id: pylint
        exclude: ^tests/
        additional_dependencies: ["pandas", "streamlit", "plotly"]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.4.1
    hooks:
      - id: mypy
        exclude: ^tests/
        additional_dependencies:
          [
            "pandas-stubs",
            "types-requests",
            "types-PyYAML",
          ]
        args: ["--ignore-missing-imports"]

  # Security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-ll"]
        exclude: ^tests/

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
