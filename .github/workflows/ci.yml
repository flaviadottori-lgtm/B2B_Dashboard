name: CI

on:
  push:
    branches: [ main, principal, develop ]
  pull_request:
    branches: [ main, principal, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pylint mypy bandit pytest duckdb

      - name: Lint with pylint
        run: |
          if [ -d src ]; then
            pylint src --exit-zero
          fi

      - name: Type check with mypy (non-blocking)
        continue-on-error: true
        run: |
          if [ -d src ]; then
            python -m mypy src --ignore-missing-imports --disable-error-code import-untyped --exclude '/\.venv/|/build/|/dist/'
          fi

      - name: Security check with bandit
        run: |
          if [ -d src ]; then
            bandit -r src -ll || true
          fi

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -d tests ]; then
            python scripts/bootstrap_duckdb.py
            pytest -q \
              --ignore=tests/test_bootstrap_duckdb.py \
              --ignore=tests/test_final_pnad.py \
              --ignore-glob="tests/test_lote*.py"
          fi
