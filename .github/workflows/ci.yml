name: CI

on:
  push:
    branches: [ main, principal, develop ]
  pull_request:
    branches: [ main, principal, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install black isort pylint mypy bandit pytest

      - name: Lint with pylint
        run: |
          if [ -d src ]; then pylint src --exit-zero; fi

      - name: Type check with mypy
        run: |
          if [ -d src ]; then python -m mypy src --ignore-missing-imports --disable-error-code import-untyped --exclude '/\.venv/|/build/|/dist/'; fi


      - name: Security check with bandit
        run: |
          if [ -d src ]; then bandit -r src -ll || true; fi

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest -q; fi
