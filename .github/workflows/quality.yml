name: Code Quality

on:
  push:
    branches: [ main, principal, develop ]
  pull_request:
    branches: [ main, principal, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black==26.1.0 isort==5.13.2 pylint mypy bandit

      - name: Run Black (format check)
        run: |
          if [ -d src ] || [ -d dashboards ] || [ -d tests ]; then
            black --check src dashboards tests
          else
            echo "No target directories found."
          fi

      - name: Run isort (import sorting)
        run: |
          if [ -d src ] || [ -d dashboards ] || [ -d tests ]; then
            isort --check-only src dashboards tests
          else
            echo "No target directories found."
          fi

      - name: Run pylint
        run: |
          if [ -d src ]; then
            pylint src --exit-zero
          else
            echo "No src directory found."
          fi

      - name: Run mypy
        run: |
          if [ -d src ]; then
            mypy src --ignore-missing-imports
          else
            echo "No src directory found."
          fi

      - name: Run bandit
        run: |
          if [ -d src ]; then
            bandit -r src -ll || true
          else
            echo "No src directory found."
          fi
