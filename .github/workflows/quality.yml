name: Code Quality

on:
  push:
    branches: [ main, principal, develop ]
  pull_request:
    branches: [ main, principal, develop ]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black isort pylint mypy bandit

      - name: Check import sorting (isort)
        run: |
          if [ -d src ] || [ -d dashboards ] || [ -d tests ]; then
            python -m isort --check-only src dashboards tests
          fi

      - name: Check formatting (black)
        run: |
          if [ -d src ] || [ -d dashboards ] || [ -d tests ]; then
            python -m black --check src dashboards tests
          fi

      - name: Lint with pylint
        run: |
          if [ -d src ]; then
            python -m pylint src --exit-zero
          fi

      - name: Type check with mypy (non-blocking)
        continue-on-error: true
        run: |
          if [ -d src ]; then
            python -m mypy src \
              --ignore-missing-imports \
              --disable-error-code import-untyped
          fi

      - name: Security scan with bandit
        run: |
          if [ -d src ]; then
            python -m bandit -r src -ll || true
          fi
