name: Code Quality

on:
  push:
    branches: [ main, principal, develop ]
  pull_request:
    branches: [ main, principal, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run isort (import sorting)
        run: |
          if [ -d src ] || [ -d dashboards ] || [ -d tests ]; then
            python -m isort --check-only src dashboards tests
          else
            echo "No target directories found."
          fi

      - name: Run Black (format check)
        run: |
          if [ -d src ] || [ -d dashboards ] || [ -d tests ]; then
            python -m black --check src dashboards tests
          else
            echo "No target directories found."
          fi

      - name: Run pylint
        run: |
          if [ -d src ]; then
            python -m pylint src --exit-zero
          else
            echo "No src directory found."
          fi

      - name: Run mypy
        run: |
          if [ -d src ]; then
            python -m mypy src --ignore-missing-imports --disable-error-code import-untyped
          else
            echo "No src directory found."
          fi



      - name: Run bandit
        run: |
          if [ -d src ]; then
            python -m bandit -r src -ll || true
          else
            echo "No src directory found."
          fi
