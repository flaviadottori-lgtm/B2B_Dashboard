[pytest]
# Configuração do pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage (opcional - ative com pytest-cov)
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    slow: marca testes como lentos
    integration: marca testes de integração
    unit: marca testes unitários
